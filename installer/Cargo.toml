[package]
name = "fncreborn-setup"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Builds and updates FNC Reborn from the player's own copy of Fight Night Champion"
publish = false

[[bin]]
name = "FNCReborn-Setup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = "0.34.2"
rfd = "0.17.2"
ureq = "2.12"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
