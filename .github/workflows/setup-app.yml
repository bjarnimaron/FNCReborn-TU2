name: Setup app

on:
  push:
    paths:
      - "installer/**"
      - "patches/**"
      - ".github/workflows/setup-app.yml"
  pull_request:
    paths:
      - "installer/**"
      - "patches/**"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          cache-workspaces: installer

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: FNCReborn-Setup.exe
          path: installer/target/release/FNCReborn-Setup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/release/FNCReborn-Setup.exe --clobber
